  <script>
    function showMessage(text, isSuccess) {
      const msgBox = document.getElementById('messageBox');
      msgBox.innerText = text;
      msgBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center animate-fade-in transition-all duration-300';
     
      if (isSuccess) {
        msgBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
      } else {
        msgBox.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
      }
    }




    function hideMessage() {
      const msgBox = document.getElementById('messageBox');
      msgBox.classList.add('hidden');
      msgBox.innerText = '';
    }




    function prosesLogin(event) {
      event.preventDefault();
     
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var btn = document.getElementById('loginBtn');
     
      btn.innerText = "Memproses...";
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      hideMessage();




      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.success) {
              ERPBridge.save(response);
              showMessage("Login Berhasil! Mengalihkan...", true);
              redirectAfterLogin(response);
            } else {
              throw new Error((response && response.message) || "Respons login tidak valid.");
            }
          })
          .withFailureHandler(function(error) {
            btn.innerText = "Masuk";
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            showMessage((error && error.message) || 'Login gagal.', false);
          })
          .loginUser(email, password);
      } else {
        setTimeout(() => {
            btn.innerText = "Masuk";
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            showMessage("MOCK: Login dicoba. Jalankan di Apps Script.", false);
        }, 1000);
      }
    }


    function redirectAfterLogin(response) {
      const route = response.route || (response.userData && response.userData.route);
      const url = response.redirectUrl || (response.baseUrl && route
        ? response.baseUrl + '?page=' + encodeURIComponent(route)
        : '');

      if (!url) {
        const btn = document.getElementById('loginBtn');
        btn.innerText = 'Masuk';
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        showMessage('Login berhasil, tetapi alamat halaman tujuan tidak tersedia.', false);
        return;
      }

      // PENTING:
      // Google Apps Script HTML Service menjalankan halaman di sandbox iframe.
      // Navigasi window.top dari callback async dapat diblokir browser.
      // Navigasi frame aktif sendiri jauh lebih konsisten dan localStorage tetap
      // tersedia pada origin Web App yang sama.
      try {
        window.location.replace(url);
      } catch (e) {
        // Fallback terakhir.
        window.location.href = url;
      }
    }

  </script>
<script>
/* ERP INTEGRATION BRIDGE v2 */
window.ERPBridge = window.ERPBridge || (function(){
  const KEY='erpSession';
  function session(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
  function save(res){if(res&&res.token){localStorage.setItem(KEY,JSON.stringify({token:res.token,user:res.userData||res.user||{}}));} return res;}
  function clear(){localStorage.removeItem(KEY);}
  function call(action,payload,onSuccess,onError){
    payload=payload||{}; const s=session();
    if(typeof google==='undefined'||!google.script||!google.script.run){onError&&onError({message:'Google Apps Script tidak tersedia. Buka URL Web App resmi.'});return;}
    google.script.run.withSuccessHandler(function(res){if(res&&res.error){onError&&onError({message:res.error});return;}onSuccess&&onSuccess(res);}).withFailureHandler(function(e){onError&&onError(e||{message:'Backend error'});}).apiCall(action,payload,s?s.token:'');
  }
  function bootstrap(page,onSuccess,onError){
    const s=session();
    if(!s||!s.token){onError&&onError({code:'NO_SESSION',message:'Sesi login tidak ditemukan.'});return;}
    if(typeof google==='undefined'||!google.script||!google.script.run){onError&&onError({message:'Google Apps Script tidak tersedia.'});return;}
    google.script.run.withSuccessHandler(function(res){if(res&&res.error){onError&&onError({message:res.error});return;}onSuccess&&onSuccess(res);}).withFailureHandler(function(e){onError&&onError(e||{message:'Bootstrap gagal'});}).getIntegratedBootstrap(s.token,page||'');
  }
  return {session,save,clear,call,bootstrap};
})();
</script>
