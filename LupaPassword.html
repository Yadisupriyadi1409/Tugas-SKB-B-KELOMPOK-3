<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f3f4f6; }
    .spinner { border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">




  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Lupa Kata Sandi</h1>
      <p id="instructionText" class="text-gray-500 text-sm mt-1">Masukkan email terdaftar Anda untuk menerima kode OTP.</p>
    </div>




    <!-- TAHAP 1: REQUEST OTP -->
    <form id="step1" class="space-y-4 block" onsubmit="event.preventDefault(); requestOTP();">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email Aktif</label>
        <input type="email" id="resetEmail" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit" id="btnStep1" class="w-full flex justify-center items-center bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
        <span id="textStep1">Kirim Kode OTP</span>
        <div id="spinStep1" class="spinner hidden ml-2"></div>
      </button>
    </form>




    <!-- TAHAP 2: VERIFIKASI OTP -->
    <form id="step2" class="space-y-4 hidden" onsubmit="event.preventDefault(); verifyOTP();">
      <div>
        <label class="block text-sm font-medium text-gray-700">Kode OTP (Cek Email)</label>
        <input type="text" id="resetOtp" maxlength="6" required class="mt-1 block w-full text-center tracking-widest text-lg font-bold px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit" id="btnStep2" class="w-full flex justify-center items-center bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">
        <span id="textStep2">Verifikasi OTP</span>
        <div id="spinStep2" class="spinner hidden ml-2"></div>
      </button>
    </form>




    <!-- TAHAP 3: PASSWORD BARU -->
    <form id="step3" class="space-y-4 hidden" onsubmit="event.preventDefault(); savePassword();">
      <div>
        <label class="block text-sm font-medium text-gray-700">Kata Sandi Baru</label>
        <input type="password" id="newPassword" minlength="6" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit" id="btnStep3" class="w-full flex justify-center items-center bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-purple-700 transition">
        <span id="textStep3">Simpan Sandi Baru</span>
        <div id="spinStep3" class="spinner hidden ml-2"></div>
      </button>
    </form>
   
    <div class="mt-6 text-center text-sm text-gray-600">
      <? var url = getScriptUrl(); ?>
      <a href="<?= url ?>?page=Login" class="text-gray-600 hover:text-blue-600 hover:underline font-medium">&larr; Kembali ke halaman Login</a>
    </div>
  </div>




  <script>
    let savedEmail = "";




    function toggleLoading(btnId, textId, spinId, isLoad, originText, loadText) {
      const btn = document.getElementById(btnId);
      const txt = document.getElementById(textId);
      const spin = document.getElementById(spinId);
     
      btn.disabled = isLoad;
      if(isLoad) {
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        spin.classList.remove('hidden');
        txt.innerText = loadText;
      } else {
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
        spin.classList.add('hidden');
        txt.innerText = originText;
      }
    }




    // Fungsi Validasi Lingkungan GAS
    function checkGoogleEnv(btnId, textId, spinId, originText) {
      if (typeof google === 'undefined' || typeof google.script === 'undefined') {
        toggleLoading(btnId, textId, spinId, false, originText, '');
        Swal.fire('Error Sistem', 'Aplikasi tidak terhubung dengan server (Google Apps Script). Pastikan Anda membuka link Web App resmi, bukan file HTML lokal.', 'error');
        return false;
      }
      return true;
    }




    function requestOTP() {
      const emailInput = document.getElementById('resetEmail').value;
      toggleLoading('btnStep1', 'textStep1', 'spinStep1', true, 'Kirim Kode OTP', 'Mengirim Email...');




      // Cek apakah script berjalan di server Google
      if (!checkGoogleEnv('btnStep1', 'textStep1', 'spinStep1', 'Kirim Kode OTP')) return;




      google.script.run
        .withSuccessHandler(function(response) {
          toggleLoading('btnStep1', 'textStep1', 'spinStep1', false, 'Kirim Kode OTP', '');
          savedEmail = emailInput;
         
          Swal.fire('Berhasil', 'OTP telah dikirim ke email Anda. Berlaku selama 5 Menit.', 'success');
         
          document.getElementById('step1').classList.add('hidden');
          document.getElementById('step2').classList.remove('hidden');
          document.getElementById('instructionText').innerText = "Masukkan 6 digit angka OTP yang kami kirim ke " + emailInput;
        })
        .withFailureHandler(function(error) {
          toggleLoading('btnStep1', 'textStep1', 'spinStep1', false, 'Kirim Kode OTP', '');
          Swal.fire('Gagal', error.message || 'Terjadi kesalahan pada server.', 'error');
        })
        .requestResetOTP(emailInput);
    }




    function verifyOTP() {
      const otpInput = document.getElementById('resetOtp').value;
      toggleLoading('btnStep2', 'textStep2', 'spinStep2', true, 'Verifikasi OTP', 'Memeriksa...');




      if (!checkGoogleEnv('btnStep2', 'textStep2', 'spinStep2', 'Verifikasi OTP')) return;




      google.script.run
        .withSuccessHandler(function(response) {
          toggleLoading('btnStep2', 'textStep2', 'spinStep2', false, 'Verifikasi OTP', '');
         
          Swal.fire('OTP Valid', 'Silakan buat kata sandi baru Anda.', 'success');
         
          document.getElementById('step2').classList.add('hidden');
          document.getElementById('step3').classList.remove('hidden');
          document.getElementById('instructionText').innerText = "Buat kata sandi baru yang kuat dan mudah diingat.";
        })
        .withFailureHandler(function(error) {
          toggleLoading('btnStep2', 'textStep2', 'spinStep2', false, 'Verifikasi OTP', '');
          Swal.fire('Gagal', error.message || 'OTP salah atau sudah kedaluwarsa.', 'error');
        })
        .verifyResetOTP(savedEmail, otpInput);
    }




    function savePassword() {
      const newPass = document.getElementById('newPassword').value;
      const otpInput = document.getElementById('resetOtp').value;




      toggleLoading('btnStep3', 'textStep3', 'spinStep3', true, 'Simpan Sandi Baru', 'Menyimpan...');




      if (!checkGoogleEnv('btnStep3', 'textStep3', 'spinStep3', 'Simpan Sandi Baru')) return;




      google.script.run
        .withSuccessHandler(function(response) {
          toggleLoading('btnStep3', 'textStep3', 'spinStep3', false, 'Simpan Sandi Baru', '');
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Kata sandi Anda telah berhasil diubah. Silakan login kembali.',
            confirmButtonColor: '#2563eb'
          }).then(() => {
            // Asumsi tombol kembali ke login berfungsi dengan cara ini
            let loginUrl = document.querySelector('a[href*="?page=Login"]').getAttribute('href');
            if(loginUrl) window.top.location.href = loginUrl;
          });
        })
        .withFailureHandler(function(error) {
          toggleLoading('btnStep3', 'textStep3', 'spinStep3', false, 'Simpan Sandi Baru', '');
          Swal.fire('Gagal', error.message || 'Gagal menyimpan kata sandi.', 'error');
        })
        .saveNewPassword(savedEmail, otpInput, newPass);
    }
  </script>
<script>
/* ERP INTEGRATION BRIDGE v2 */
window.ERPBridge = window.ERPBridge || (function(){
  const KEY='erpSession';
  function session(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
  function save(res){if(res&&res.token){localStorage.setItem(KEY,JSON.stringify({token:res.token,user:res.userData||res.user||{}}));} return res;}
  function clear(){localStorage.removeItem(KEY);}
  function call(action,payload,onSuccess,onError){
    payload=payload||{}; const s=session();
    if(typeof google==='undefined'||!google.script||!google.script.run){onError&&onError({message:'Google Apps Script tidak tersedia. Buka URL Web App resmi.'});return;}
    google.script.run.withSuccessHandler(function(res){if(res&&res.error){onError&&onError({message:res.error});return;}onSuccess&&onSuccess(res);}).withFailureHandler(function(e){onError&&onError(e||{message:'Backend error'});}).apiCall(action,payload,s?s.token:'');
  }
  function bootstrap(page,onSuccess,onError){
    const s=session();
    if(!s||!s.token){onError&&onError({code:'NO_SESSION',message:'Sesi login tidak ditemukan.'});return;}
    if(typeof google==='undefined'||!google.script||!google.script.run){onError&&onError({message:'Google Apps Script tidak tersedia.'});return;}
    google.script.run.withSuccessHandler(function(res){if(res&&res.error){onError&&onError({message:res.error});return;}onSuccess&&onSuccess(res);}).withFailureHandler(function(e){onError&&onError(e||{message:'Bootstrap gagal'});}).getIntegratedBootstrap(s.token,page||'');
  }
  return {session,save,clear,call,bootstrap};
})();
</script>
</body>
</html>
